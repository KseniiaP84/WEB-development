<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 8</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div class="logo">MySite</div>

      <nav id="menu">
        <a href="#">Головна</a>
        <a href="#">Про нас</a>
        <a href="#">Послуги</a>
        <a href="#">Контакти</a>
      </nav>

      <button id="burger">&#9776;</button>
    </header>

    <section class="carousel">
      <div class="slides">
        <img
          src="https://placehold.co/800x400/ff9999/000?text=Slide+1"
          class="slide active"
        />
        <img
          src="https://placehold.co/800x400/99ccff/000?text=Slide+2"
          class="slide"
        />
        <img
          src="https://placehold.co/800x400/99ff99/000?text=Slide+3"
          class="slide"
        />
      </div>

      <button class="prev">&#10094;</button>
      <button class="next">&#10095;</button>

      <div class="dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </section>

    <section class="large-images">
      <img src="https://placehold.co/300x200/orange/white?text=Large+1" />
      <img src="https://placehold.co/300x200/purple/white?text=Large+2" />
      <img src="https://placehold.co/300x200/green/white?text=Large+3" />
    </section>

    <section class="medium-images">
      <img src="https://placehold.co/250x150/red/white?text=Medium+1" />
      <img src="https://placehold.co/250x150/blue/white?text=Medium+2" />
    </section>

    <script src="script.js"></script>
  </body>
</html>
